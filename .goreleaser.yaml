version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: pnp-powershell-mcp-server
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - best-practices.md

checksum:
  name_template: checksums.txt

release:
  mode: replace
  use_existing_draft: true
  replace_existing_artifacts: true

changelog:
  disable: true
